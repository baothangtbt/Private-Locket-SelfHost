{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center h-[70vh] text-center space-y-6">
    
    <div class="w-28 h-28 bg-[#FFB800] rounded-3xl flex items-center justify-center shadow-[0_0_30px_rgba(255,184,0,0.3)]">
        <i class="fa-solid fa-heart text-5xl text-black"></i>
    </div>
    
    <div>
        <h2 class="text-3xl font-bold mb-2 text-white">Chào bạn! 👋</h2>
        <p class="text-gray-400">Đăng nhập để kết nối với nhóm.</p>
    </div>

    <form method="POST" action="/login" class="w-full space-y-4 px-4">
        <input type="text" name="username" placeholder="Tên đăng nhập (viết liền)" required 
               class="w-full p-4 bg-gray-800 rounded-2xl border border-gray-700 focus:border-[#FFB800] focus:ring-1 focus:ring-[#FFB800] outline-none text-white transition">
        
        <input type="password" name="password" placeholder="Mật khẩu bí mật" required 
               class="w-full p-4 bg-gray-800 rounded-2xl border border-gray-700 focus:border-[#FFB800] focus:ring-1 focus:ring-[#FFB800] outline-none text-white transition">
        
        <div class="flex gap-3 pt-4">
            <button type="submit" name="action" value="login" 
                    class="flex-1 p-4 bg-[#FFB800] text-black font-extrabold rounded-2xl hover:bg-yellow-400 transition shadow-lg">
                Đăng Nhập
            </button>
            <button type="submit" name="action" value="register" 
                    class="flex-1 p-4 bg-gray-800 text-white font-bold rounded-2xl border border-gray-700 hover:bg-gray-700 transition">
                Đăng Ký
            </button>
        </div>
    </form>
</div>
{% endblock %}
