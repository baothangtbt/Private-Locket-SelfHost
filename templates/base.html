<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Locket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20 bg-black min-h-screen">
    <div class="max-w-md mx-auto min-h-screen bg-neutral-900 shadow-2xl overflow-hidden relative border-x border-gray-800">
        
        <div class="flex justify-between items-center p-4 bg-black/80 backdrop-blur sticky top-0 z-50 border-b border-gray-800">
            <h1 class="text-2xl font-bold text-[#FFB800] tracking-tighter">Locket 💛</h1>
            {% if current_user.is_authenticated %}
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold bg-gray-800 px-2 py-1 rounded-full text-gray-300">@{{ current_user.username }}</span>
                <a href="/logout" class="text-gray-400 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            {% endif %}
        </div>

        <div class="px-4 pt-2">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-red-600 text-white p-3 rounded-xl text-center text-sm font-bold shadow-lg mb-2 animate-bounce">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
            
        <div class="p-4">
            {% block content %}{% endblock %}
        </div>

    </div>
</body>
</html>
